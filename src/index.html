<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LoreStitch</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the stored theme before Angular boots to avoid a mode flash.
      try {
        var mode = localStorage.getItem('lorestitch-theme');
        if (
          mode === 'dark' ||
          (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('theme-dark');
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined is self-hosted and subsetted; see styles.scss. -->
    <link
      rel="preload"
      href="/fonts/material-symbols-outlined.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
