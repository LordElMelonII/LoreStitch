<!-- The expanded stack stays in the DOM (aria-controls must resolve, and the
     rows animate out on collapse); `inert` keeps collapsed rows out of the
     tab order and assistive tech while they fade. -->
<div
  class="fab-stack"
  id="mobile-fab-stack"
  role="group"
  aria-label="Quick actions"
  [attr.inert]="expanded() ? null : ''"
>
  @for (item of actions; track item.id; let row = $index) {
    <div class="fab-row" [style.--fab-row]="row">
      <span class="fab-label" [id]="'mobile-fab-label-' + item.id">{{ item.label }}</span>
      <button
        matMiniFab
        type="button"
        class="fab-row-button"
        [attr.aria-labelledby]="'mobile-fab-label-' + item.id"
        (click)="select(item.id)"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
      </button>
    </div>
  }
</div>

<!-- Collapsed state: the one FAB that anchors the stack. `menu` reads as the
     actions cluster it opens (the stack's first row is New entry, so a bare
     `add` would promise the wrong thing); expanded it swaps to `close`, the
     M3 FAB-menu toggle morph. -->
<button
  matFab
  type="button"
  class="fab-toggle"
  aria-label="Quick actions"
  aria-controls="mobile-fab-stack"
  [attr.aria-expanded]="expanded()"
  (click)="toggle()"
>
  <mat-icon>{{ expanded() ? 'close' : 'menu' }}</mat-icon>
</button>
