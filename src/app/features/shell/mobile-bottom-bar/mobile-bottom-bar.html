<!-- Stamped only while the bar is shown (mobile + project + nothing
     covering it): hidden state contributes nothing to the DOM, so the
     History item below can never collide with the topbar's own history
     button under strict-mode locator resolution (the shell e2e clicks it
     by aria-label). -->
@if (visible()) {
  <!-- M3 bottom action bar: five icon-over-label rows, always visible while
       shown (no expanded/collapsed state to manage). Visible labels are short
       (navigation-bar style); buttons that need a longer accessible name
       carry an explicit aria-label. -->
  <nav class="bar" aria-label="Quick actions">
  <button type="button" class="bar-item" (click)="select('new-entry')">
    <mat-icon aria-hidden="true">post_add</mat-icon>
    <span class="bar-label">New entry</span>
  </button>

  <!-- Short visible label (M3 navigation-bar style — the row is ~72px wide on
       a 390px phone); the aria-label keeps the full action name for AT and
       the shell e2e. -->
  <button type="button" class="bar-item" aria-label="Search & replace" (click)="select('search-replace')">
    <mat-icon aria-hidden="true">find_replace</mat-icon>
    <span class="bar-label">Search</span>
  </button>

  <!-- Standalone menu trigger: deliberately NOT carrying
       appTouchSafeNestedMenuTrigger. That directive exists for nested
       `mat-menu-item` submenus, whose hover stream opens them mid-tap from a
       parent menu panel; this trigger sits on a bar button with no parent
       menu, so the emulated-hover bug it fixes cannot occur here (the
       directive's own doc mandates standalone triggers must not carry it). -->
  <button type="button" class="bar-item" [matMenuTriggerFor]="exportMenu">
    <mat-icon aria-hidden="true">file_download</mat-icon>
    <span class="bar-label">Export</span>
  </button>

  <button type="button" class="bar-item" (click)="select('batch')">
    <mat-icon aria-hidden="true">checklist</mat-icon>
    <span class="bar-label">Batch edit</span>
  </button>

  <button
    type="button"
    class="bar-item"
    aria-label="Toggle history drawer"
    (click)="select('history')"
  >
    <!-- Same unsaved-changes warn badge as the topbar's history button
         (which phones no longer render — the affordance moved here). No
         aria-hidden on this icon: the badge carries meaning, mirroring the
         topbar markup; the button's aria-label names it. -->
    <mat-icon
      [matBadge]="workspace.hasUnsavedChanges() ? '!' : null"
      matBadgeColor="warn"
      [matBadgeHidden]="!workspace.hasUnsavedChanges()"
    >
      history
    </mat-icon>
    <span class="bar-label">History</span>
  </button>
</nav>

<!-- The SAME five-entry export menu the topbar offers: section headers,
     descriptions and dividers are intentionally duplicated markup (charter:
     duplicate markup, never logic) — every click handler calls the shared
     `ProjectActionsService` wrappers, one implementation home. The global
     `.mat-mdc-menu-panel.export-menu` rules style this panel identically.
     `yPosition="above"`: the trigger is docked to the viewport's bottom
     edge, so the panel must open upward from it. -->
<mat-menu #exportMenu="matMenu" yPosition="above" class="export-menu">
  <div class="menu-section">Use in SillyTavern</div>
  <button mat-menu-item (click)="actions.exportStNative()">
    <mat-icon>data_object</mat-icon>
    <span class="menu-text">
      <span class="menu-title">World Info JSON</span>
      <span class="menu-desc">Import via SillyTavern’s World Info panel</span>
    </span>
  </button>

  <div class="menu-section">Backup</div>
  <button mat-menu-item (click)="actions.exportProjectArchive()">
    <mat-icon>archive</mat-icon>
    <span class="menu-text">
      <span class="menu-title">Project archive (.stproj)</span>
      <span class="menu-desc"
        >Full backup with version history — export regularly, reopen in LoreStitch</span
      >
    </span>
  </button>

  <mat-divider></mat-divider>
  <div class="menu-section">Split a modular lorebook</div>
  <button mat-menu-item (click)="actions.exportSelectedEntries()">
    <mat-icon>call_split</mat-icon>
    <span class="menu-text">
      <span class="menu-title">Export selected entries…</span>
      <span class="menu-desc">Write a subset of entries as a standalone lorebook</span>
    </span>
  </button>

  <mat-divider></mat-divider>
  <div class="menu-section">Reference &amp; proofreading</div>
  <button mat-menu-item (click)="actions.exportBook()">
    <mat-icon>book</mat-icon>
    <span class="menu-text">
      <span class="menu-title">Character Book JSON</span>
      <span class="menu-desc">Standard V2 spec for character cards &amp; third-party tools</span>
    </span>
  </button>
  <button mat-menu-item (click)="actions.exportDigest()">
    <mat-icon>description</mat-icon>
    <span class="menu-text">
      <span class="menu-title">Proofread digest (Markdown)</span>
      <span class="menu-desc">All entries as readable text</span>
    </span>
  </button>
</mat-menu>
}
