<div
  class="panel-anchor"
  role="region"
  aria-label="Placement, activation, keys and advanced options"
  [attr.id]="panelId()"
  [class.open]="expanded()"
  [inert]="!expanded()"
>
  <div class="panel-clip">
    <div class="panel">
      <app-entry-placement [entry]="entry()" />
      <app-entry-keys [entry]="entry()" />
      <app-entry-activation [entry]="entry()" />
      <app-entry-inclusion-group [entry]="entry()" />
      <app-entry-recursion-timing [entry]="entry()" />
      <app-entry-matching-sources [entry]="entry()" />
    </div>
  </div>
</div>

<mat-card appearance="filled" class="cluster-card trigger-card">
  <div class="control-strip">
    <mat-slide-toggle
      [checked]="entry().enabled"
      (change)="updates.setFlag(entry(), 'enabled', $event)"
      matTooltip="Include this entry in scans"
    >
      Enabled
    </mat-slide-toggle>

    <mat-button-toggle-group
      class="strategy-toggle"
      [value]="triggerState()"
      (change)="updates.setTriggerState(entry(), $event.value)"
      hideSingleSelectionIndicator
      aria-label="Trigger strategy"
    >
      <mat-button-toggle
        value="normal"
        matTooltip="🟢 Triggered only in the presence of a key"
        aria-label="Normal: keyword-triggered"
      >
        🟢 Normal
      </mat-button-toggle>
      <mat-button-toggle
        value="constant"
        matTooltip="🔵 Does not need any keywords, and will trigger regardless of content"
        aria-label="Constant: always inserted"
      >
        🔵 Constant
      </mat-button-toggle>
      <mat-button-toggle
        value="vectorized"
        matTooltip="🔗 Allowed to be inserted by embedding similarity (Vector Storage)"
        aria-label="Vectorized: inserted by embedding similarity"
      >
        🔗 Vector
      </mat-button-toggle>
    </mat-button-toggle-group>

    <mat-form-field class="num" subscriptSizing="dynamic" appearance="fill">
      <mat-label>Order</mat-label>
      <input matInput type="number" [formField]="stripForm.order" />
    </mat-form-field>

    <button
      matIconButton
      type="button"
      class="expand-toggle"
      (click)="toggle()"
      [attr.aria-expanded]="expanded()"
      [attr.aria-controls]="panelId()"
      [matTooltip]="
        expanded()
          ? 'Hide placement, keys and advanced options'
          : 'Show placement, keys and advanced options'
      "
      aria-label="Toggle entry options"
    >
      <mat-icon aria-hidden="true">{{ toggleIcon() }}</mat-icon>
    </button>
  </div>
</mat-card>
