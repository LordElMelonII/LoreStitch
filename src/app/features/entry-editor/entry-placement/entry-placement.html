<p class="section-title">Placement</p>
<div class="field-row">
  <mat-form-field
    subscriptSizing="dynamic"
    appearance="fill"
    class="position"
    matTooltip="Where in the prompt this entry is inserted"
  >
    <mat-label>Position</mat-label>
    <mat-select
      [value]="entry().position ?? 'before_char'"
      (selectionChange)="updates.setPosition(entry(), $event.value)"
    >
      @for (option of positionOptions; track option.value) {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  @if (isAtDepth()) {
    <mat-form-field
      class="num"
      subscriptSizing="dynamic"
      appearance="fill"
      matTooltip="0 is the bottom of the prompt; messages deeper in the chat have larger depth"
    >
      <mat-label>Depth</mat-label>
      <input
        matInput
        type="number"
        min="0"
        [value]="entry().extensions['depth'] ?? 4"
        (input)="updates.setExtensionNumber(entry(), 'depth', $event, 4)"
      />
    </mat-form-field>
    <mat-form-field
      subscriptSizing="dynamic"
      appearance="fill"
      matTooltip="Message role used when the entry is injected at depth"
    >
      <mat-label>Role</mat-label>
      <mat-select
        [value]="entry().extensions['role'] ?? 0"
        (selectionChange)="updates.setExtension(entry(), 'role', $event.value)"
      >
        @for (role of roleOptions; track role.value) {
          <mat-option [value]="role.value">{{ role.icon }} {{ role.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  }
  @if (isOutlet()) {
    <mat-form-field
      class="grow"
      subscriptSizing="dynamic"
      appearance="fill"
      matTooltip="Name used to pull this content into the prompt with the outlet macro in the Prompt Manager / Advanced Formatting"
    >
      <mat-label>Outlet Name</mat-label>
      <input
        matInput
        [value]="entry().extensions['outlet_name'] ?? ''"
        (input)="updates.setExtensionText(entry(), 'outlet_name', $event)"
        placeholder="e.g. scene-notes"
      />
    </mat-form-field>
  }

  <mat-form-field
    class="num"
    subscriptSizing="dynamic"
    appearance="fill"
    matTooltip="Insertion priority within the token budget — entries with a higher priority are kept when the budget runs out"
  >
    <mat-label>Priority</mat-label>
    <input
      matInput
      type="number"
      [value]="entry().priority ?? ''"
      (input)="updates.setNumber(entry(), 'priority', $event)"
      placeholder="—"
    />
  </mat-form-field>
</div>
