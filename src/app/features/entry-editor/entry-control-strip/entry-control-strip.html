<mat-card appearance="filled" class="cluster-card strip-card">
  <div class="control-strip">
    <mat-slide-toggle
      [checked]="entry().enabled"
      (change)="updates.setFlag(entry(), 'enabled', $event)"
      matTooltip="Include this entry in scans"
    >
      Enabled
    </mat-slide-toggle>

    <mat-button-toggle-group
      class="strategy-toggle"
      [value]="triggerState()"
      (change)="updates.setTriggerState(entry(), $event.value)"
      hideSingleSelectionIndicator
      aria-label="Trigger strategy"
    >
      <mat-button-toggle
        value="normal"
        matTooltip="🟢 Triggered only in the presence of a key"
        aria-label="Normal: keyword-triggered"
      >
        🟢 Normal
      </mat-button-toggle>
      <mat-button-toggle
        value="constant"
        matTooltip="🔵 Does not need any keywords, and will trigger regardless of content"
        aria-label="Constant: always inserted"
      >
        🔵 Constant
      </mat-button-toggle>
      <mat-button-toggle
        value="vectorized"
        matTooltip="🔗 Allowed to be inserted by embedding similarity (Vector Storage)"
        aria-label="Vectorized: inserted by embedding similarity"
      >
        🔗 Vector
      </mat-button-toggle>
    </mat-button-toggle-group>

    <mat-chip-listbox class="modifier-chips" multiple aria-label="Execution modifiers">
      <mat-chip-option
        [selected]="entry().selective ?? false"
        [disabled]="isConstant()"
        (selectionChange)="updates.setChipFlag(entry(), 'selective', $event)"
        [matTooltip]="
          isConstant()
            ? 'Not available while Constant — the entry always triggers regardless of keys'
            : 'Use secondary keys to filter matches'
        "
      >
        Selective
      </mat-chip-option>
      <mat-chip-option
        [selected]="entry().case_sensitive ?? false"
        [disabled]="isConstant()"
        (selectionChange)="updates.setChipFlag(entry(), 'case_sensitive', $event)"
        [matTooltip]="
          isConstant()
            ? 'Not available while Constant — keys are not scanned'
            : 'Match keys case-sensitively'
        "
      >
        Case Sensitive
      </mat-chip-option>
    </mat-chip-listbox>
  </div>
</mat-card>
