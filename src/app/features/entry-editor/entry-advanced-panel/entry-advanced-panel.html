<mat-expansion-panel class="advanced">
  <mat-expansion-panel-header>
    <mat-panel-title>SillyTavern Advanced</mat-panel-title>
    <mat-panel-description>Extensions carried in exports</mat-panel-description>
  </mat-expansion-panel-header>
  <div class="field-row advanced-grid">
    <mat-form-field subscriptSizing="dynamic" appearance="fill">
      <mat-label>Probability %</mat-label>
      <input
        matInput
        type="number"
        min="0"
        max="100"
        [value]="entry().extensions['probability']"
        (input)="updates.setExtensionNumber(entry(), 'probability', $event, 100)"
      />
    </mat-form-field>
    <mat-form-field subscriptSizing="dynamic" appearance="fill">
      <mat-label>Secondary Logic</mat-label>
      <mat-select
        [value]="entry().extensions['selectiveLogic']"
        (selectionChange)="updates.setExtension(entry(), 'selectiveLogic', $event.value)"
      >
        @for (option of logicOptions; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-slide-toggle
      [checked]="entry().extensions['exclude_recursion']"
      (change)="updates.setExtensionFlag(entry(), 'exclude_recursion', $event)"
      matTooltip="Entry cannot be triggered by other entries"
    >
      Exclude Recursion
    </mat-slide-toggle>
    <mat-slide-toggle
      [checked]="entry().extensions['prevent_recursion']"
      (change)="updates.setExtensionFlag(entry(), 'prevent_recursion', $event)"
      matTooltip="Entry content cannot trigger other entries"
    >
      Prevent Recursion
    </mat-slide-toggle>
  </div>
</mat-expansion-panel>
