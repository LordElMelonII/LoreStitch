<app-topbar (toggleEntries)="toggleLeft()" (toggleHistory)="toggleRight()" />

<mat-sidenav-container class="workspace">
  <mat-sidenav
    class="entries-sidenav"
    [mode]="viewport() === 'mobile' ? 'over' : 'side'"
    [opened]="leftOpened()"
    (closed)="closeLeft()"
  >
    @if (workspace.activeProject()) {
      @defer (on immediate) {
        <app-entry-list />
      } @placeholder {
        <div class="side-placeholder"></div>
      }
    } @else {
      <div class="side-placeholder"></div>
    }
  </mat-sidenav>

  <mat-sidenav-content class="editor-content" role="main">
    @if (workspace.activeProject()) {
      @defer (on immediate) {
        <app-entry-editor />
      } @placeholder {
        <div class="editor-placeholder"></div>
      }
    } @else {
      <app-welcome-screen />
    }
  </mat-sidenav-content>

  <mat-sidenav
    class="history-sidenav"
    position="end"
    [mode]="viewport() === 'desktop' ? 'side' : 'over'"
    [opened]="rightOpened()"
    (closed)="closeRight()"
  >
    @if (workspace.activeProject()) {
      @defer (on idle) {
        <app-commit-history />
      } @placeholder {
        <div class="side-placeholder"></div>
      }
    } @else {
      <div class="side-placeholder"></div>
    }
  </mat-sidenav>
</mat-sidenav-container>
