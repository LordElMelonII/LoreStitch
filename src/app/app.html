<app-topbar (toggleEntries)="toggleLeft()" (toggleHistory)="toggleRight()" />

<mat-sidenav-container class="workspace">
  <mat-sidenav
    class="entries-sidenav"
    [mode]="viewport() === 'mobile' ? 'over' : 'side'"
    [opened]="leftOpened()"
    (closed)="closeLeft()"
  >
    @if (workspace.activeProject()) {
      @defer (on immediate) {
        <app-entry-list />
      } @placeholder {
        <div class="side-placeholder"></div>
      }
    } @else {
      <div class="side-placeholder"></div>
    }
  </mat-sidenav>

  <mat-sidenav-content class="editor-content" role="main">
    @if (workspace.activeProject()) {
      @defer (on immediate) {
        <app-entry-editor />
      } @placeholder {
        <div class="editor-placeholder"></div>
      }
    } @else {
      <app-welcome-screen />
    }
  </mat-sidenav-content>

  <mat-sidenav
    class="history-sidenav"
    position="end"
    [mode]="viewport() === 'desktop' ? 'side' : 'over'"
    [opened]="rightOpened()"
    (closed)="closeRight()"
  >
    @if (workspace.activeProject()) {
      @defer (on idle) {
        <app-commit-history />
      } @placeholder {
        <div class="side-placeholder"></div>
      }
    } @else {
      <div class="side-placeholder"></div>
    }
  </mat-sidenav>
</mat-sidenav-container>

<!-- Mobile quick actions: phones get a collapsible bottom-end FAB instead of
     relying on desktop-only topbar buttons and keyboard shortcuts. Mounted
     outside the sidenav container — Material's container only projects
     mat-sidenav/mat-sidenav-content children — and fixed to the viewport
     bottom-end, so it never scrolls with the editor pane (see mobile-fab.scss
     for the anchor and stacking rationale). -->
<app-mobile-fab [overlayOpen]="anyOverlayOpen()" [drawerOpen]="anyDrawerOpen()" (action)="runFabAction($event)" />
