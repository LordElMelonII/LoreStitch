<app-topbar
  (toggleEntries)="toggleLeft()"
  (toggleHistory)="toggleRight()"
  (openShortcuts)="openShortcutsHelp()"
/>

<mat-sidenav-container class="workspace" #workspaceEl>
  <!-- D3: the docked drawer's live width (App.entriesWidth, clamped
       320–480). The binding yields null on the mobile band so the CSS
       full-width contract wins; CSS min/max-width repeat the clamp as
       belt-and-braces behind this binding (app.scss). -->
  <mat-sidenav
    class="entries-sidenav"
    #entriesPane
    [mode]="viewport() === 'mobile' ? 'over' : 'side'"
    [opened]="leftOpened()"
    [style.width.px]="viewport() === 'mobile' ? null : entriesWidth()"
    (opened)="onEntriesDrawerOpened()"
    (closed)="closeLeft()"
  >
    @if (workspace.activeProject()) {
      @defer (on immediate) {
        <!-- closeDrawer: the mobile drawer's in-pane close button (the
             full-width overlay has no scrim to tap) routes to the same
             closeLeft() the sidenav's (closed) event uses. -->
        <app-entry-list (closeDrawer)="closeLeft()" />
      } @placeholder {
        <div class="side-placeholder"></div>
      }
    } @else {
      <div class="side-placeholder"></div>
    }
    @if (viewport() !== 'mobile') {
      <!-- D3 resize handle: a 6px strip on the drawer's inner (right) edge,
           next to the projected entry list inside the sidenav. Rendered only
           on non-mobile bands — removed from the DOM on phones, never
           display:none (responsive-shape contract). Pointer capture on
           pointerdown retargets the whole drag gesture onto this element;
           the keyboard path steps the width and commits on keyup. -->
      <div
        class="entries-resize-handle"
        role="separator"
        aria-orientation="vertical"
        [attr.aria-valuemin]="entriesWidthMin"
        [attr.aria-valuemax]="entriesWidthMax"
        [attr.aria-valuenow]="entriesWidth()"
        tabindex="0"
        aria-label="Resize entries panel"
        (pointerdown)="onResizePointerDown($event)"
        (pointermove)="onResizePointerMove($event)"
        (pointerup)="onResizePointerUp($event)"
        (pointercancel)="onResizePointerCancel($event)"
        (keydown)="onResizeKeydown($event)"
        (keyup)="onResizeKeyup()"
        (dblclick)="resetEntriesWidth()"
      ></div>
    }
  </mat-sidenav>

  <mat-sidenav-content class="editor-content" role="main">
    @if (workspace.activeProject()) {
      @defer (on immediate) {
        <app-entry-editor />
      } @placeholder {
        <div class="editor-placeholder"></div>
      }
    } @else {
      <app-welcome-screen />
    }
  </mat-sidenav-content>

  <!-- (opened): on phones the shell focuses the drawer pane once it has
       opened (App's pane-focus policy, bound on both drawers) — the docked
       bar goes inert under the open drawer and releases focus to <body>, so
       the pane must take it for Escape-to-close to work. Tablet/desktop
       triggers keep their focus; the policy is phone-only. -->
  <mat-sidenav
    class="history-sidenav"
    #historyPane
    position="end"
    [mode]="viewport() === 'desktop' ? 'side' : 'over'"
    [opened]="rightOpened()"
    (opened)="onHistoryDrawerOpened()"
    (closed)="closeRight()"
  >
    @if (workspace.activeProject()) {
      @defer (on idle) {
        <app-commit-history />
      } @placeholder {
        <div class="side-placeholder"></div>
      }
    } @else {
      <div class="side-placeholder"></div>
    }
  </mat-sidenav>
</mat-sidenav-container>

<!-- Mobile quick actions: phones get an M3 bottom action bar hosting the
     actions that desktop-only topbar buttons and keyboard shortcuts cover
     (including History, which leaves the phone topbar with this bar as its
     home). Mounted outside the sidenav container — Material's container only
     projects mat-sidenav/mat-sidenav-content children — but as a normal flex
     child of app-root, NOT fixed-positioned: the workspace shrinks above it,
     so it can never overlap editor content (the bug that retired the FAB;
     see mobile-bottom-bar.scss for the surface rationale). The bar stays
     docked while drawers and dialogs are open: [barState] lowers it to
     `backgrounded` under a drawer (it sits below the sidenav container, so
     it synthesizes the scrim look itself), swaps it to `batch` while the
     entries drawer holds a selection (the transplanted toolbar), and
     full-viewport CDK overlays simply cover it. The selection facts ride
     the same public `EntryList` signals the state computation reads (the
     bar contract, Task 06 §3.2/§3.3). -->
<app-mobile-bottom-bar
  [barState]="barState()"
  [selectionCount]="barSelectionCount()"
  [allShownSelected]="barAllShownSelected()"
  [someShownSelected]="barSomeShownSelected()"
  (action)="runBarAction($event)"
  (batchAction)="runBatchBarAction($event)"
/>
